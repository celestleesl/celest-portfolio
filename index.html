<style>
  :root {
    --cream: #f7f7f6;
    --paper: #ffffff;
    --ink: #111111;
    --muted: #55565c;
    --faint: #8c8d92;
    --line: #e3e3e1;
    --sand: #e6e6e3;
    --red: #c81e1e;
    --red-deep: #9e1717;
    --shadow-soft: 0 1px 2px rgba(17,17,17,.04), 0 16px 32px -18px rgba(17,17,17,.16);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: var(--cream);
    color: var(--ink);
    -webkit-font-smoothing: antialiased;
    display: flex;
    flex-direction: column;
    min-height: 100vh;
    overflow-x: hidden;
  }
  a { color: inherit; text-decoration: none; }
  .hand { font-family: "Gochi Hand", cursive; }

  .top { padding: 28px 36px; }
  .top img { height: 30px; display: block; }

  main {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 30px 24px 60px;
    position: relative;
  }
  .stage { max-width: 640px; text-align: center; position: relative; z-index: 2; }

  .status-pill {
    display: inline-flex; align-items: center; gap: 10px;
    background: var(--paper); border: 1px solid var(--line); border-radius: 999px;
    padding: 9px 18px; font-size: 13px; font-weight: 700; letter-spacing: .02em;
    box-shadow: var(--shadow-soft); margin-bottom: 34px;
  }
  .dot { width: 9px; height: 9px; border-radius: 50%; background: var(--red); position: relative; }
  .dot::after {
    content: ''; position: absolute; inset: 0; border-radius: 50%; background: var(--red);
    animation: ping 1.8s cubic-bezier(0,0,.2,1) infinite;
  }
  @keyframes ping { 0% { transform: scale(1); opacity: .7; } 80%, 100% { transform: scale(3); opacity: 0; } }

  h1 {
    font-family: "Fraunces", serif; font-weight: 700;
    font-size: clamp(36px, 8vw, 76px); line-height: 1.06; letter-spacing: -0.02em;
    margin: 0 0 22px; text-wrap: balance;
  }
  h1 em { display: block; font-style: italic; font-weight: 500; }

  .sub { font-size: clamp(16px, 2.2vw, 18px); line-height: 1.65; color: var(--muted); max-width: 48ch; margin: 0 auto 34px; }

  .progress {
    width: min(320px, 80%); height: 8px; border-radius: 999px; background: var(--sand);
    margin: 0 auto 12px; overflow: hidden; position: relative;
  }
  .progress::before {
    content: ''; position: absolute; top: 0; bottom: 0; width: 42%; border-radius: 999px; background: var(--ink);
    animation: slide 2.2s cubic-bezier(.6,0,.4,1) infinite;
  }
  @keyframes slide { 0% { left: -45%; } 100% { left: 103%; } }
  .progress-note { font-size: 20px; color: var(--faint); margin-bottom: 42px; display: block; }

  .actions { display: flex; flex-wrap: wrap; gap: 12px; justify-content: center; margin-bottom: 30px; }
  .btn {
    display: inline-flex; align-items: center; gap: 9px; padding: 14px 26px; border-radius: 12px;
    font-size: 14px; font-weight: 700; border: 1px solid transparent; cursor: pointer;
    transition: transform .15s ease, background .15s ease, border-color .15s ease;
  }
  .btn:hover { transform: translateY(-2px); }
  .btn-red { background: var(--red); color: #fff; }
  .btn-red:hover { background: var(--red-deep); }
  .btn-sand { background: var(--sand); color: var(--ink); border-color: var(--sand); }
  .btn-sand:hover { border-color: var(--ink); }
  .icon { width: 1em; height: 1em; stroke: currentColor; fill: none; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }

  .social { display: flex; gap: 14px; justify-content: center; }
  .social a {
    width: 44px; height: 44px; border-radius: 50%; border: 1px solid var(--line); background: var(--paper);
    display: flex; align-items: center; justify-content: center; box-shadow: var(--shadow-soft);
    transition: transform .15s ease, background .15s ease, color .15s ease;
  }
  .social a:hover { transform: translateY(-2px); background: var(--ink); color: var(--paper); }
  .social svg { width: 18px; height: 18px; }

  .sticker {
    position: absolute; z-index: 1; display: flex; align-items: center; justify-content: center;
    border-radius: 14px; box-shadow: var(--shadow-soft); font-weight: 800;
    animation: float 5s ease-in-out infinite;
  }
  .s-cmd { top: 12%; left: 8%; width: 58px; height: 58px; background: var(--ink); color: var(--paper); font-size: 24px; --r: -9deg; transform: rotate(-9deg); }
  .s-hash { top: 22%; right: 9%; width: 46px; height: 46px; background: var(--paper); border: 1px solid var(--line); font-size: 18px; --r: 8deg; transform: rotate(8deg); animation-delay: -1.5s; }
  .s-cam { bottom: 16%; left: 11%; width: 52px; height: 52px; background: var(--paper); border: 1px solid var(--line); --r: 6deg; transform: rotate(6deg); animation-delay: -3s; }
  .s-chart { bottom: 22%; right: 8%; width: 56px; height: 56px; background: var(--ink); color: var(--paper); --r: -7deg; transform: rotate(-7deg); animation-delay: -2s; }
  .sticker svg { width: 24px; height: 24px; }
  @keyframes float {
    0%, 100% { transform: translateY(0) rotate(var(--r, 0deg)); }
    50% { transform: translateY(-10px) rotate(calc(var(--r, 0deg) + 2deg)); }
  }

  footer { text-align: center; padding: 22px 24px 30px; font-size: 12px; color: var(--faint); font-weight: 600; letter-spacing: .04em; }

  @media (max-width: 720px) {
    .top { padding: 22px 22px; }
    .s-hash, .s-cam { display: none; }
    .s-cmd { top: 6px; left: auto; right: 22px; width: 40px; height: 40px; font-size: 18px; }
    .s-chart { bottom: 14px; right: 22px; width: 42px; height: 42px; }
    .s-chart svg { width: 20px; height: 20px; }
  }
  @media (prefers-reduced-motion: reduce) {
    .sticker, .dot::after, .progress::before { animation: none; }
    .progress::before { left: 0; width: 60%; }
  }
</style>
</head>
